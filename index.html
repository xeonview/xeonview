<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="XeonView Team">
    <meta name="robots" content="index, follow">
    <title>xeonview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            opacity:85%;
        } 
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 730;
        }   
        #tv-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        </style>  
</head>
<body>
    <div id="tv-container" style="width: 100%; height: 100vh; overflow: hidden;">
        <iframe src="https://embedtv.vercel.app/" allow="encrypted-media" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
    </div>
</body>
</html>
